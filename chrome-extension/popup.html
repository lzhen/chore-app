<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nesmi</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="icons/nesmi-32.png" width="32" height="32" alt=""><h1>Nesmi</h1></header><h2>A little less to remember.</h2>
<p id="disclosure">Your chores stay in this browser only. They are not sent to Empathie or synced with the Nesmi website. Avoid sensitive information.</p>
<form id="add"><label for="task">Add a household task</label><div class="entry"><input id="task" maxlength="160" required autocomplete="off" placeholder="e.g. Water the plants"><button>Add</button></div></form>
<p id="status" role="status" aria-live="polite"></p><ul id="tasks"></ul><button id="clear" class="secondary">Clear completed</button>
<footer><a href="https://empathie.ai/nesmi/" target="_blank" rel="noopener noreferrer">Open Nesmi website ↗</a><a href="privacy.html" target="_blank">Extension privacy</a></footer><script src="popup.js"></script></body></html>
