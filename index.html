<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/nesmi-32-20261008.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/nesmi-180-20261008.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nesmi helps families share household responsibilities, see what needs doing today, and keep routines fair without constant reminders." />
    <meta name="theme-color" content="#080809" />
    <script>
      // Apply the chosen appearance before the app loads to avoid a bright flash.
      (() => {
        const requested = new URLSearchParams(location.search).get('theme');
        let saved;
        try { saved = localStorage.getItem('theme'); } catch {}
        const selection = ['light', 'dark', 'system'].includes(requested) ? requested : saved;
        const isDark = ['dark', 'crystal-dark', 'midnight'].includes(selection) ||
          ((!selection || selection === 'system' || !['light', 'crystal-light', 'aurora'].includes(selection)) && matchMedia('(prefers-color-scheme: dark)').matches);
        const root = document.documentElement;
        root.dataset.theme = isDark ? 'dark' : 'light';
        root.classList.toggle('dark', isDark);
        root.style.colorScheme = isDark ? 'dark' : 'light';
        root.style.backgroundColor = isDark ? '#080809' : '#ffffff';
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#080809' : '#ffffff';
      })();
    </script>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Nesmi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="canonical" href="https://empathie.ai/nesmi/" />
    <title>Nesmi — Shared household chores, without the nagging</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
