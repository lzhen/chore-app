name: Capture Chorely App Review video
on:
  push:
    branches: [assets/chorely-review-video]
    paths: ['scripts/store-capture/**', '.github/workflows/chorely-review-video.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: latest-stable}
      - run: brew install ffmpeg
      - name: Build isolated App Review evidence app
        env: {HUSKY: '0'}
        run: |
          npm ci
          CAPACITOR_BUILD=true npm run build
          python3 scripts/store-capture/prepare.py
          npx cap sync ios
          mkdir -p review-output
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/chorely-review" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > review-output/build.log 2>&1 || { tail -100 review-output/build.log; exit 1; }
      - name: Record native walkthrough
        run: python3 -u scripts/store-capture/review_video.py "$RUNNER_TEMP/chorely-review/Build/Products/Debug-iphonesimulator"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chorely-app-review-video
          path: review-output/
          retention-days: 14
