name: Nesmi Deployed API Security Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'supabase/functions/nesmi-service/**'
      - '.github/workflows/nesmi-deployed-api-smoke.yml'

permissions:
  contents: read

jobs:
  unauthenticated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure deployed API refuses unauthenticated task access
        env:
          URL: https://rosofbnimiothwxsabyr.supabase.co/functions/v1/nesmi-service
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --max-time 15 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"list_chores"}' "$URL")
          echo "Unauthenticated request HTTP status: $code"
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "::error::Expected authentication rejection (401/403), got $code"
            exit 1
          fi
          echo "PASS: task data is not returned to unauthenticated requests"
