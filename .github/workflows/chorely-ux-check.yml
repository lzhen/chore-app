name: Chorely UX verification
on:
  push:
    branches: [fix/chorely-mobile-ux]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chorely-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
        env: {HUSKY: '0'}
      - name: Export source and locked local development tools
        run: |
          git archive --format=tar.gz --output=chorely-source.tar.gz HEAD
          tar -czf chorely-development-tools.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: chorely-source-and-tools
          path: |
            chorely-source.tar.gz
            chorely-development-tools.tar.gz
          retention-days: 1
      - run: npm run test:run && npm run build
      - name: UX regression tests
        if: ${{ hashFiles('e2e/ux.spec.ts') != '' }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/ux.spec.ts --project=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chorely-ux-browser-evidence
          path: |
            test-results
            playwright-report
          retention-days: 14
