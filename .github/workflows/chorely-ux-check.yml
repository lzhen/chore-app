name: Chorely UX verification
on:
  push:
    branches: [main, fix/chorely-mobile-ux, release/chorely-app-store]
    paths: ['src/**', 'e2e/**', 'package*.json', 'playwright.ux.config.ts', '.github/workflows/chorely-ux-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chorely-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
        env: {HUSKY: '0'}
      - name: Unit tests, timezone regressions and production build
        run: |
          npm run test:run
          TZ=America/Los_Angeles npx vitest run src/utils/dates.test.ts
          TZ=Asia/Shanghai npx vitest run src/utils/dates.test.ts
          npm run build
      - name: Isolated phone UX regression tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.ux.config.ts
      - name: Save test screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chorely-ux-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
