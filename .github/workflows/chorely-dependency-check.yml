name: Chorely production dependency report
on:
  push:
    branches: [main, release/chorely-app-store]
    paths: ['package*.json', '.github/workflows/chorely-dependency-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check production dependencies without changing the lockfile
        run: |
          npm audit --omit=dev --json > production-dependency-audit.json || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('production-dependency-audit.json','utf8'));
          if(report.error)throw Error('Dependency registry unavailable; no clean-security conclusion can be drawn.');
          console.log(JSON.stringify(report.metadata,null,2));
          for(const [name,info] of Object.entries(report.vulnerabilities||{})) console.log(JSON.stringify({name,severity:info.severity,range:info.range,isDirect:info.isDirect,fixAvailable:info.fixAvailable,via:info.via}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chorely-production-dependency-report
          path: production-dependency-audit.json
          retention-days: 14
