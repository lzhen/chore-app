name: Import and verify approved Chorely UX changes
on:
  push:
    branches: [fix/chorely-mobile-ux]
    paths: ['.release-transport/**', '.github/workflows/chorely-import-ux.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chorely-import-ux
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chorely-mobile-ux
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Apply the exact locally built and reviewed source delta
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          root=pathlib.Path.cwd()
          payload=''.join((root/f'.release-transport/chunk-{i}.b64').read_text() for i in range(1,5))
          raw=gzip.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='5f810b586435bd57960056dbfbac1f7ccfa045c6eb7f7b84bd1611cae32b7a0e','Source delta checksum mismatch'
          items=json.loads(raw)
          assert len(items)==26
          seen=set()
          for item in items:
              path=item['path']
              assert path not in seen
              seen.add(path)
              assert not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
              assert path.startswith(('src/','e2e/','docs/')) or path=='playwright.ux.config.ts'
              target=root/path
              before=target.read_text() if target.exists() else ''
              assert hashlib.sha256(before.encode()).hexdigest()==item['before'],f'Baseline changed: {path}'
              lines=before.splitlines(keepends=True)
              for start,end,replacement in reversed(item['edits']):
                  assert 0<=start<=end<=len(lines)
                  lines[start:end]=[replacement]
              after=''.join(lines)
              assert hashlib.sha256(after.encode()).hexdigest()==item['after'],f'Result mismatch: {path}'
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(after)
              print('Verified source:',path)
          PY
      - name: Commit verified source only to the isolated UX branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src e2e/ux.spec.ts docs/CHORELY_UX_RELEASE.md playwright.ux.config.ts
          git rm .release-transport/chunk-*.b64
          git commit -m 'Implement reviewed Chorely Today experience and reliable task workflows'
          git push origin HEAD:refs/heads/fix/chorely-mobile-ux
          echo "Verified source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
        env: {HUSKY: '0'}
      - name: Unit tests and production build
        run: |
          npm run test:run
          TZ=America/Los_Angeles npx vitest run src/utils/dates.test.ts
          TZ=Asia/Shanghai npx vitest run src/utils/dates.test.ts
          npm run build
      - name: Isolated browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.ux.config.ts
      - name: Save screenshots and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chorely-approved-ux-verification
          path: |
            test-results/
            playwright-report/
          retention-days: 14
