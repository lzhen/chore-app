name: Verify patched release dependencies
on:
  push:
    branches: [release/chorely-app-store]
    paths: ['.github/workflows/chorely-patch-deps.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: release/chorely-app-store}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: latest-stable}
      - name: Update only the affected dependencies
        env: {HUSKY: '0'}
        run: |
          npm install uuid@11.1.1 --save-exact --package-lock-only --ignore-scripts
          npm update ws --package-lock-only --ignore-scripts
          npm audit --omit=dev --json > dependency-audit.json
      - name: Verify web, mobile interaction and native archive
        env: {HUSKY: '0'}
        run: |
          ios/App/ci_scripts/ci_post_clone.sh
          npm run test:run
          npx playwright install chromium
          npx playwright test -c playwright.ux.config.ts
          ios/App/ci_scripts/ci_pre_xcodebuild.sh
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Chorely-patched.xcarchive" CODE_SIGNING_ALLOWED=NO archive > archive-check.log 2>&1 || { tail -100 archive-check.log; exit 1; }
      - name: Commit the verified dependency lock only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Patch uuid and ws dependencies; verify mobile UX and iOS archive'
          git push origin HEAD:refs/heads/release/chorely-app-store
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chorely-patched-release-verification
          path: |
            dependency-audit.json
            archive-check.log
            test-results/
          retention-days: 14
