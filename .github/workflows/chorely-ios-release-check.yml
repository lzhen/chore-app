name: NestMe iOS Release Check
on:
  push:
    branches: [main, release/chorely-app-store, release/apple-readiness-20261003, release/chorely-appstore-rc-20261003]
    paths: ['ios/**', 'ci_scripts/**', 'src/**', 'public/**', 'package*.json', 'capacitor.config.ts', 'vite.config.ts', '.github/workflows/chorely-ios-release-check.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', 'ci_scripts/**', 'src/**', 'public/**', 'package*.json', 'capacitor.config.ts', 'vite.config.ts', '.github/workflows/chorely-ios-release-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chorely-ios-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  archive-check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Prepare the same dependencies used by Xcode Cloud
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
        run: ios/App/ci_scripts/ci_post_clone.sh
      - name: Run unit tests and pre-archive checks
        run: |
          npm run test:run
          ios/App/ci_scripts/ci_pre_xcodebuild.sh
      - name: Compile a real iOS Release archive without signing
        run: |
          mkdir -p release-check
          xcodebuild -version > release-check/xcode-version.txt
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NestMe.xcarchive" CODE_SIGNING_ALLOWED=NO archive > release-check/archive.log 2>&1 || { tail -120 release-check/archive.log; exit 1; }
          APP="$RUNNER_TEMP/NestMe.xcarchive/Products/Applications/NestMe.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'com.pawssible.chorely'
          test -s "$APP/public/index.html"
          swift ios/App/ci_scripts/verify_app_icon.swift ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png "$APP" > release-check/app-icon-result.txt
          cat release-check/app-icon-result.txt
          cp "$APP"/AppIcon*.png release-check/
          plutil -convert json -o release-check/built-info.json "$APP/Info.plist"
          shasum -a 256 "$APP/Assets.car" > release-check/compiled-assets-sha256.txt
          ditto -c -k --sequesterRsrc --keepParent "$APP" release-check/chorely-unsigned-device-app.zip
          printf '%s\n' 'PASS: unsigned device Release archive compiled with bundled app resources and approved nest icons.' 'This is not an App Store upload or an iPhone installer. Signing and upload remain in the existing Xcode Cloud workflow.' > release-check/result.txt
          cat release-check/result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chorely-ios-release-verification
          path: release-check/
          retention-days: 14
