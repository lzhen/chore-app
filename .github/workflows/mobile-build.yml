name: NestMe - Native Builds
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  pull_request:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm install --prefix mobile --no-audit --no-fund
      - run: cd mobile && npm run add:android
      - run: chmod +x mobile/android/gradlew && cd mobile/android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: chorely-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: latest-stable}
      - run: npm install --prefix mobile --no-audit --no-fund
      - run: cd mobile && npm run add:ios
      - run: cd mobile && xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --sequesterRsrc --keepParent mobile/build/Build/Products/Debug-iphonesimulator/App.app chorely-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chorely-ios-simulator-not-iphone-installer
          path: chorely-ios-simulator.zip
          retention-days: 30
